name: Update ClawHub downloads
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - skills/catalogue.json
      - scripts/update-clawhub-downloads.mjs
      - tests/clawhub-downloads.test.mjs
      - .github/workflows/update-clawhub-downloads.yml
permissions:
  contents: write
concurrency:
  group: clawhub-downloads
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'AntreasAntoniou/antreasantoniou.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/clawhub-downloads.test.mjs
      - run: node scripts/update-clawhub-downloads.mjs
      - name: Publish verified snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/clawhub-downloads.json data/clawhub-downloads.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified ClawHub download counter'
            git push origin HEAD:main
          fi
